name: deform_conv2d smoke

on:
  push:
    branches:
      - ci/deform-conv2d-smoke
  workflow_dispatch:

jobs:
  deform-conv2d-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest torch torchvision

      - name: Run deform_conv2d tests
        env:
          PYMIL_TEST_TARGETS: mlprogram
        run: |
          python -m pytest coremltools/converters/mil/frontend/torch/test/test_torch_ops.py::TestDeformConv2d -q --tb=short

  deform-conv2d-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies and Core ML binaries
        run: |
          python -m pip install --upgrade pip
          python -m pip install coremltools==9.0 pytest torch torchvision
          (
            cd /tmp
            python - <<'PY'
          import os
          import pathlib
          import shutil

          import coremltools

          wheel_pkg = pathlib.Path(coremltools.__file__).resolve().parent
          source_pkg = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "coremltools"
          for rel in [
              "libcoremlpython.so",
              "libmilstoragepython.so",
              "libmodelpackage.so",
          ]:
              shutil.copy2(wheel_pkg / rel, source_pkg / rel)

          kmeans_src = next((wheel_pkg / "_deps" / "kmeans1d").glob("_core*.so"))
          kmeans_dst = source_pkg / "_deps" / "kmeans1d" / kmeans_src.name
          kmeans_dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(kmeans_src, kmeans_dst)
          print(f"copied Core ML binaries from {wheel_pkg} to {source_pkg}")
          PY
          )
          python -m pip install -e .

      - name: Verify native Core ML bindings
        run: |
          python - <<'PY'
          import coremltools as ct
          from coremltools.converters.mil.backend.mil.load import BlobWriter
          from coremltools.models.utils import _macos_version

          print("coremltools", ct.__version__)
          print("macOS", _macos_version())
          print("BlobWriter available", BlobWriter is not None)
          assert BlobWriter is not None
          PY

      - name: Run deform_conv2d native prediction tests
        env:
          PYMIL_TEST_TARGETS: mlprogram
        run: |
          python -m pytest coremltools/converters/mil/frontend/torch/test/test_torch_ops.py::TestDeformConv2d -q --tb=short
