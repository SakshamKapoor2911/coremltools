name: deform_conv2d smoke

on:
  push:
    branches:
      - ci/deform-conv2d-smoke
  workflow_dispatch:

jobs:
  deform-conv2d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest torch torchvision

      - name: Run deform_conv2d tests
        env:
          PYMIL_TEST_TARGETS: mlprogram
        run: |
          python -m pytest coremltools/converters/mil/frontend/torch/test/test_torch_ops.py::TestDeformConv2d -q --tb=short
